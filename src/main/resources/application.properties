# ===================================================================
# Online Volunteer Management Platform - Configuration
# ===================================================================
# db-secret.properties holds the real Supabase credentials locally.
# On Render, use DB_URL / DB_USERNAME / DB_PASSWORD env variables.
spring.config.import=optional:file:./db-secret.properties

# Application Name & Server Port
spring.application.name=Volunteer Management Platform
# PORT is provided by hosting platforms (Render etc.); defaults to 8080 on your PC
server.port=${PORT:8080}

# ===================================================================
# DATABASE CONFIGURATION (PostgreSQL / Supabase)
# Locally: credentials come from db-secret.properties (not committed).
# On Render: set DB_URL, DB_USERNAME, DB_PASSWORD as env variables.
# ===================================================================
# Default local URL points to a local PostgreSQL instance.
# The db-secret.properties file overrides this with the Supabase URL.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/volunteer_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
# Driver is auto-detected from the JDBC URL — no explicit class needed.

# ===================================================================
# JPA & HIBERNATE SETTINGS
# 'update' automatically creates and updates database tables from entities
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===================================================================
# THYMELEAF CONFIGURATION
# Disable caching so template changes reflect immediately in dev mode
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Maximum multipart file upload limit (for attachments if needed)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
