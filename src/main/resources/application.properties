# ===================================================================
# Online Volunteer Management Platform - Configuration
# ===================================================================

# Application Name & Server Port
spring.application.name=Volunteer Management Platform
# PORT is provided by hosting platforms (Render etc.); defaults to 8080 on your PC
server.port=${PORT:8080}

# ===================================================================
# DATABASE CONFIGURATION (MySQL 8)
# If your MySQL username or password is not "root/root", update them below:
# ===================================================================
# On your PC the default values after ':' are used. On the hosting server we set
# DB_URL, DB_USERNAME and DB_PASSWORD as environment variables instead.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/volunteer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA & HIBERNATE SETTINGS
# 'update' automatically creates and updates database tables from entities
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===================================================================
# THYMELEAF CONFIGURATION
# Disable caching so template changes reflect immediately in dev mode
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Maximum multipart file upload limit (for attachments if needed)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
