# ===================================================================
# Fallback Profile: H2 In-Memory Database (No MySQL installation required)
# Run with: .\mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# ===================================================================
spring.datasource.url=jdbc:h2:mem:volunteer_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
