<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Post Opportunity')}"></head>
<body class="bg-light">

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Flash Alerts -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card p-4 shadow-sm bg-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="d-flex align-items-center gap-3">
                                <div class="stat-icon bg-primary-subtle text-primary">
                                    <i class="bi bi-calendar-plus"></i>
                                </div>
                                <div>
                                    <h3 class="fw-bold mb-0">Post New Volunteering Opportunity</h3>
                                    <p class="text-muted small mb-0">Fill in the event logistics and volunteer responsibilities</p>
                                </div>
                            </div>
                            <!-- Fill Sample Data Button for Quick Viva Demo -->
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="fillSampleData()">
                                <i class="bi bi-magic me-1"></i> Fill Sample Data
                            </button>
                        </div>

                        <form th:action="@{/org/opportunities/new}" th:object="${opportunity}" method="post">

                            <!-- Title -->
                            <div class="mb-3">
                                <label for="title" class="form-label fw-semibold">Event Title / Headline</label>
                                <input type="text" class="form-control" id="title" th:field="*{title}"
                                       placeholder="e.g. Community Tree Plantation Drive" required maxlength="150">
                            </div>

                            <!-- Description -->
                            <div class="mb-3">
                                <label for="description" class="form-label fw-semibold">Detailed Description &amp; Responsibilities</label>
                                <textarea class="form-control" id="description" th:field="*{description}"
                                          rows="4" placeholder="Describe the goal of the initiative, what volunteers will do, and what supplies are provided..." required></textarea>
                            </div>

                            <!-- Location -->
                            <div class="mb-3">
                                <label for="location" class="form-label fw-semibold">Venue / Address</label>
                                <input type="text" class="form-control" id="location" th:field="*{location}"
                                       placeholder="e.g. City Botanical Gardens, Sector 4" required maxlength="200">
                            </div>

                            <div class="row g-3 mb-3">
                                <!-- Date -->
                                <div class="col-md-4">
                                    <label for="eventDate" class="form-label fw-semibold">Event Date</label>
                                    <input type="date" class="form-control" id="eventDate" th:field="*{eventDate}" required>
                                </div>

                                <!-- Start Time -->
                                <div class="col-md-4">
                                    <label for="startTime" class="form-label fw-semibold">Start Time</label>
                                    <input type="time" class="form-control" id="startTime" th:field="*{startTime}" required>
                                </div>

                                <!-- End Time -->
                                <div class="col-md-4">
                                    <label for="endTime" class="form-label fw-semibold">End Time</label>
                                    <input type="time" class="form-control" id="endTime" th:field="*{endTime}" required>
                                </div>
                            </div>

                            <!-- Total Slots -->
                            <div class="mb-4">
                                <label for="totalSlots" class="form-label fw-semibold">Volunteer Capacity (Total Slots)</label>
                                <input type="number" class="form-control" id="totalSlots" th:field="*{totalSlots}"
                                       min="1" max="500" placeholder="e.g. 25" required>
                                <small class="text-muted">The maximum number of volunteers permitted to sign up.</small>
                            </div>

                            <div class="d-flex justify-content-between align-items-center border-top pt-3">
                                <a th:href="@{/org/opportunities}" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-left me-1"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-check2 me-1"></i> Publish Opportunity
                                </button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript to automatically populate sample opportunity details for quick demonstration -->
    <script>
        function fillSampleData() {
            // Calculates a target date 14 days from today in YYYY-MM-DD format for the HTML5 date input
            const d = new Date();
            d.setDate(d.getDate() + 14);
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');

            document.getElementById('title').value = 'Campus Tree Plantation Drive';
            document.getElementById('description').value = 'Plant 100 saplings around the college campus. Gloves, tools and water will be provided. Please wear comfortable shoes.';
            document.getElementById('location').value = 'Galgotias University, Main Lawn';
            document.getElementById('eventDate').value = `${yyyy}-${mm}-${dd}`;
            document.getElementById('startTime').value = '09:00';
            document.getElementById('endTime').value = '13:00';
            document.getElementById('totalSlots').value = 25;
        }
    </script>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
