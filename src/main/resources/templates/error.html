<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Error')}"></head>
<body class="bg-light">

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <div class="container my-5 py-5 text-center">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card p-5 shadow-sm bg-white border-0">
                    <div class="stat-icon mx-auto mb-3 bg-danger-subtle text-danger" style="width: 70px; height: 70px; font-size: 2rem;">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                    </div>
                    <h1 class="display-3 fw-bold text-dark" th:text="${statusCode}">404</h1>
                    <h4 class="fw-bold mb-3" th:text="${errorTitle}">Page Not Found</h4>
                    <p class="text-muted mb-4" th:text="${errorMessage}">
                        The requested page could not be located on the server.
                    </p>
                    <div class="d-flex justify-content-center gap-2">
                        <a th:href="@{/}" class="btn btn-primary px-4 py-2">
                            <i class="bi bi-house-door me-1"></i> Return Home
                        </a>
                        <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 py-2">
                            <i class="bi bi-arrow-left me-1"></i> Go Back
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
