<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Login')}"></head>
<body class="bg-light">

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Flash Alerts -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card p-4 shadow-sm bg-white">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <div class="stat-icon mx-auto mb-2 bg-primary-subtle text-primary">
                                <i class="bi bi-box-arrow-in-right fs-3"></i>
                            </div>
                            <h3 class="fw-bold">Sign In</h3>
                            <p class="text-muted small">Access your volunteer, organization, or admin dashboard</p>
                        </div>

                        <!-- Login Form -->
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="emailInput" class="form-label fw-semibold">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="emailInput" name="email"
                                           placeholder="e.g. rahul@gmail.com" required autofocus>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="passwordInput" class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="passwordInput" name="password"
                                           placeholder="Enter your password" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2 shadow-sm">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="small text-muted mb-0">Don't have an account?
                                <a th:href="@{/register}" class="fw-semibold text-decoration-none">Create an account</a>
                            </p>
                        </div>

                        <hr class="my-4 text-muted">

                        <!-- Quick Demo Credentials Helper for Viva Presentation -->
                        <div class="bg-light p-3 rounded border">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="small fw-bold text-secondary text-uppercase">
                                    <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Logins
                                </span>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-outline-secondary btn-sm text-start"
                                        onclick="fillCredentials('admin@gmail.com', 'admin123')">
                                    <i class="bi bi-shield-lock me-1 text-danger"></i> <strong>Admin:</strong> admin@gmail.com
                                </button>
                                <button type="button" class="btn btn-outline-secondary btn-sm text-start"
                                        onclick="fillCredentials('greenearth@gmail.com', 'org123')">
                                    <i class="bi bi-building me-1 text-primary"></i> <strong>Org:</strong> greenearth@gmail.com
                                </button>
                                <button type="button" class="btn btn-outline-secondary btn-sm text-start"
                                        onclick="fillCredentials('rahul@gmail.com', 'vol123')">
                                    <i class="bi bi-person me-1 text-success"></i> <strong>Volunteer:</strong> rahul@gmail.com
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/layout :: footer}"></div>

    <script>
        function fillCredentials(email, password) {
            document.getElementById('emailInput').value = email;
            document.getElementById('passwordInput').value = password;
        }
    </script>
</body>
</html>
