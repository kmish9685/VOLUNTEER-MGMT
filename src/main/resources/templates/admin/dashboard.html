<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Admin Dashboard')}"></head>
<body class="bg-light">

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Flash Alerts -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="container my-4">
        <!-- Dashboard Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <span class="badge bg-danger-subtle text-danger fw-semibold px-2 py-1">System Administration</span>
                <h2 class="fw-bold mb-0">Platform Overview Dashboard</h2>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/admin/opportunities/review}" class="btn btn-warning position-relative fw-semibold">
                    <i class="bi bi-bell me-1"></i> Review Events
                    <span class="badge rounded-pill bg-danger ms-1" th:if="${pendingOpportunitiesCount > 0}"
                          th:text="${pendingOpportunitiesCount}">0</span>
                </a>
                <a th:href="@{/admin/users/new}" class="btn btn-primary">
                    <i class="bi bi-person-plus me-1"></i> Add User
                </a>
            </div>
        </div>

        <!-- KPI Metrics Grid -->
        <div class="row g-3 mb-4">
            <!-- Volunteers -->
            <div class="col-sm-6 col-lg-3">
                <div class="card p-3 stat-card bg-white card-hover">
                    <div class="d-flex align-items-center gap-3">
                        <div class="stat-icon bg-primary-subtle text-primary">
                            <i class="bi bi-people-fill"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-0" th:text="${totalVolunteers}">0</h3>
                            <span class="text-muted small text-uppercase fw-semibold">Volunteers</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Organizations -->
            <div class="col-sm-6 col-lg-3">
                <div class="card p-3 stat-card bg-white card-hover" style="border-left-color: #0284c7;">
                    <div class="d-flex align-items-center gap-3">
                        <div class="stat-icon bg-info-subtle text-info">
                            <i class="bi bi-building"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-0" th:text="${totalOrganizations}">0</h3>
                            <span class="text-muted small text-uppercase fw-semibold">Organizations</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Registrations -->
            <div class="col-sm-6 col-lg-3">
                <div class="card p-3 stat-card bg-white card-hover" style="border-left-color: #8b5cf6;">
                    <div class="d-flex align-items-center gap-3">
                        <div class="stat-icon bg-purple-subtle text-purple" style="background-color: #f3e8ff; color: #7e22ce;">
                            <i class="bi bi-clipboard-check"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-0" th:text="${totalRegistrations}">0</h3>
                            <span class="text-muted small text-uppercase fw-semibold">Total Signups</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Total Service Hours -->
            <div class="col-sm-6 col-lg-3">
                <div class="card p-3 stat-card bg-white card-hover" style="border-left-color: #16a34a;">
                    <div class="d-flex align-items-center gap-3">
                        <div class="stat-icon bg-success-subtle text-success">
                            <i class="bi bi-award-fill"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-0" th:text="${#numbers.formatDecimal(totalHours, 1, 1)}">0.0</h3>
                            <span class="text-muted small text-uppercase fw-semibold">Total Hours</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Opportunity Pipeline Status Strip -->
        <div class="card p-3 mb-4 bg-white shadow-sm">
            <h6 class="fw-bold text-secondary text-uppercase small mb-3">
                <i class="bi bi-funnel me-1"></i> Volunteering Opportunity Pipeline
            </h6>
            <div class="row g-3 text-center">
                <div class="col-md-6">
                    <div class="p-2 border rounded bg-warning-subtle text-warning-emphasis">
                        <h4 class="fw-bold mb-1" th:text="${pendingOpportunitiesCount}">0</h4>
                        <span class="small fw-semibold">Pending Review</span>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="p-2 border rounded bg-success-subtle text-success-emphasis">
                        <h4 class="fw-bold mb-1" th:text="${approvedOpportunitiesCount}">0</h4>
                        <span class="small fw-semibold">Approved &amp; Live</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
