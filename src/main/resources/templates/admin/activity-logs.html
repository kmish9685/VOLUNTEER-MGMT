<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Activity Logs')}"></head>
<body class="bg-light">

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Flash Alerts -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="container my-4">
        <!-- Header -->
        <div class="mb-4">
            <span class="badge bg-secondary-subtle text-secondary fw-semibold px-2 py-1">Security &amp; Audit</span>
            <h2 class="fw-bold mb-0">System Activity Audit Log</h2>
            <p class="text-muted small">Chronological history of security events, administrative updates, and user actions</p>
        </div>

        <!-- Logs Table -->
        <div class="card bg-white shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th scope="col" style="width: 20%;">Timestamp</th>
                                <th scope="col" style="width: 25%;">User</th>
                                <th scope="col">Action Details</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(logs)}">
                                <td colspan="3" class="text-center py-4 text-muted">No activity logs recorded.</td>
                            </tr>
                            <tr th:each="log : ${logs}">
                                <td class="text-muted small">
                                    <i class="bi bi-clock me-1"></i>
                                    <span th:text="${#temporals.format(log.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2026-09-28 11:22:33</span>
                                </td>
                                <td>
                                    <div class="fw-semibold text-dark" th:text="${log.user != null ? log.user.fullName : 'System'}">User</div>
                                    <small class="text-muted" th:text="${log.user != null ? log.user.role : 'SYSTEM'}">ROLE</small>
                                </td>
                                <td>
                                    <span class="text-dark" th:text="${log.action}">Action description</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
