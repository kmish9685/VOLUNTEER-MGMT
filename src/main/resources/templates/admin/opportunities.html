<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('All Opportunities')}"></head>
<body class="bg-light">

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Flash Alerts -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="container my-4">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <span class="badge bg-primary-subtle text-primary fw-semibold px-2 py-1">Event Registry</span>
                <h2 class="fw-bold mb-0">All System Opportunities</h2>
            </div>
            <a th:href="@{/admin/opportunities/review}" class="btn btn-warning fw-semibold">
                <i class="bi bi-hourglass-split me-1"></i> Review Pending Queue
            </a>
        </div>

        <!-- Opportunities Table -->
        <div class="card bg-white shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">Event Title</th>
                                <th scope="col">Organization</th>
                                <th scope="col">Date &amp; Time</th>
                                <th scope="col">Slots</th>
                                <th scope="col">Status</th>
                                <th scope="col">Admin Remark</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(opportunities)}">
                                <td colspan="6" class="text-center py-4 text-muted">No opportunities registered in the system.</td>
                            </tr>
                            <tr th:each="opp : ${opportunities}">
                                <td>
                                    <div class="fw-bold text-dark" th:text="${opp.title}">Tree Drive</div>
                                    <small class="text-muted"><i class="bi bi-geo-alt me-1 text-danger"></i><span th:text="${opp.location}">Location</span></small>
                                </td>
                                <td>
                                    <span class="fw-semibold text-secondary" th:text="${opp.organization.fullName}">Org Name</span>
                                </td>
                                <td>
                                    <div th:text="${opp.eventDate}">2026-10-15</div>
                                    <small class="text-muted" th:text="${opp.startTime + ' - ' + opp.endTime}">09:00 - 13:00</small>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${opp.totalSlots}">25</span>
                                </td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${opp.status.name() == 'APPROVED' ? 'badge-approved' :
                                                           (opp.status.name() == 'PENDING' ? 'badge-pending' : 'badge-rejected')}"
                                          th:text="${opp.status}">APPROVED</span>
                                </td>
                                <td>
                                    <small class="text-danger fw-semibold" th:if="${opp.adminRemark}" th:text="${opp.adminRemark}">Remark</small>
                                    <span class="text-muted small" th:unless="${opp.adminRemark}">&mdash;</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
